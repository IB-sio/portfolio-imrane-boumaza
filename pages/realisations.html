    <main id="contenu" class="container"><div class="page-heading"><p class="eyebrow">04 / PROJETS & TRAVAUX PRATIQUES</p><h1>Mes réalisations</h1><p class="lead">Du lycée au BTS : des projets organisés par domaine, avec les configurations réalisées et les compétences travaillées.</p></div><nav class="domain-links" aria-label="Mes réalisations"><a href="#domaine-0">Systèmes &amp; services</a><a href="#domaine-1">Réseaux &amp; cybersécurité</a><a href="#domaine-2">Web &amp; bases de données</a><a href="#domaine-3">Robotique &amp; maintenance</a></nav><section><div class="filters" role="group" aria-label="Filtrer les réalisations"><button class="filter" type="button" data-filter="Tout" aria-pressed="true">Tout</button><button class="filter" type="button" data-filter="Réseau" aria-pressed="false">Réseau</button><button class="filter" type="button" data-filter="Systèmes" aria-pressed="false">Systèmes</button><button class="filter" type="button" data-filter="Sécurité" aria-pressed="false">Sécurité</button><button class="filter" type="button" data-filter="Web" aria-pressed="false">Web</button><button class="filter" type="button" data-filter="Robotique" aria-pressed="false">Robotique</button><button class="filter" type="button" data-filter="Maintenance" aria-pressed="false">Maintenance</button></div><p id="result-count" class="result-count" role="status" aria-live="polite"></p><div class="grid" id="projects-grid"></div><noscript><ul><li>NetVision · Haute disponibilité AD — Deux contrôleurs de domaine et des services d’infrastructure.</li><li>DNS BIND9 &amp; serveur web Apache — Résolution de noms, zone inversée et validation depuis Windows.</li><li>Nextcloud &amp; Active Directory — Connecter un service de fichiers à l’annuaire de l’organisation.</li><li>NAS personnel · OpenMediaVault — Installer OpenMediaVault à la maison et y stocker mes fichiers sur un HDD, avec un SSD pour la rapidité du serveur.</li><li>Samba · Partages sous Debian — Partages de fichiers avec Samba sur Debian.</li><li>Fedora · Administration personnelle — Administrer mon environnement Linux et diagnostiquer le matériel de mon ordinateur.</li><li>Infrastructure Windows/Linux · TP01 — Relier un routeur Debian, un domaine Active Directory et un client Windows 11.</li><li>AP FRUIT · Équipe Mangue — Une infrastructure segmentée avec deux pare-feu et une DMZ.</li><li>pfSense · Sécurisation complète d’un réseau — Configurer le filtrage, les accès, la détection d’intrusions et la continuité WAN dans un TP individuel.</li><li>Serveur Debian en DMZ · Mangue — Publier des services web, SSH et FTP dans un réseau séparé du LAN.</li><li>pfSense · Portail captif — Mettre en place un accès réseau avec authentification et tester la redirection.</li><li>pfSense · Limitation de débit — Limiter le trafic web à 1 Mbit/s avec les limiters de pfSense.</li><li>Réseau Cisco Packet Tracer — Adressage et routage dans un environnement simulé.</li><li>Infrastructure réseau · Bac Pro — Un projet de groupe réunissant réseau, serveurs et documentation.</li><li>Audit de sécurité · Laboratoire Kali — Identifier des services exposés et étudier une vulnérabilité dans un laboratoire pédagogique.</li><li>Passe ton hack d’abord · Challenge cyber national — Résoudre en équipe des épreuves de cybersécurité lors du challenge national pour lycéens et étudiants.</li><li>Cisco · Routeurs physiques et console série — Raccorder plusieurs routeurs Cisco et les configurer en ligne de commande depuis un PC.</li><li>Dépannage · Réseau et virtualisation — Identifier la cause d’un incident et corriger la configuration à partir de trois situations rencontrées en TP.</li><li>Site de l’Épicerie du monde — Un site React avec WordPress en CMS headless, de Figma au déploiement Netlify.</li><li>LIVRIO · Application web en HTTPS — Déployer une application avec NGINX, PHP-FPM, MariaDB et un certificat HTTPS auto-signé.</li><li>Entreprise de déménagement · Pile LEMP — Déployer une application avec NGINX, PHP-FPM, MariaDB et un certificat HTTPS auto-signé.</li><li>Programmation · Exercices Python et SQL — Pratiquer les bases de Python et les requêtes SQL dans les exercices de formation.</li><li>Robot piloté par téléphone — D’un châssis récupéré à un robot piloté avec Dabble sur mon téléphone.</li><li>Robot suiveur de ligne — Construire un robot équipé de capteurs pour suivre une ligne noire sur un circuit.</li><li>Maintenance · Diagnostic de PC — Diagnostiquer des pannes, réparer des postes et accompagner les utilisateurs.</li></ul></noscript></section></main>
